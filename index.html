<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piso - Viết Nhạc Nhanh</title>
    <!-- Add Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- abcjs CSS -->
    <link rel="stylesheet" href="node_modules/abcjs/abcjs-audio.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">🎵</span>
        <h1>Piso Music</h1>
      </div>
      <p class="subtitle">Môi trường soạn thảo ABC Notation chuyên nghiệp!</p>
    </header>

    <!-- TAB NAVIGATION -->
    <nav class="app-tabs">
      <button class="tab-btn active" id="tab-btn-write">✍️ Viết Nhạc</button>
      <button class="tab-btn" id="tab-btn-listen">🎧 Nghe Nhạc (Studio)</button>
    </nav>

    <main class="app-container tab-content active" id="tab-write">
      <!-- Left side: Image Viewer (Top) + Sheet Music (Bottom) -->
      <section class="panel left-panel">
        <div class="panel-header">
          <h2>👁️ So Sánh Bản Nhạc</h2>
        </div>
        <div class="panel-content" id="comparison-container">
          
          <!-- Image Upload & Viewer -->
          <div id="image-container">
            <div id="upload-prompt" class="upload-prompt">
              <span class="upload-icon">📂</span>
              <p>Kéo thả ảnh hoặc nhấn vào đây để tải ảnh bản nhạc mẫu lên</p>
              <input type="file" id="image-upload" accept="image/*" hidden />
            </div>
            <img id="uploaded-image" style="display: none;" alt="Bản nhạc mẫu" />
          </div>

          <!-- Divider -->
          <div class="divider">Kết Quả (Sheet Music)</div>

          <!-- ABCJS visual rendering -->
          <div id="paper" class="sheet-music-display"></div>

        </div>
      </section>

      <!-- Right side: ABC Editor / Karaoke Mode -->
      <section class="panel right-panel">
        <div class="panel-header" style="background: var(--primary); display: flex; justify-content: space-between; align-items: center;">
          <h2 style="color: white; margin: 0 auto;">✍️ Viết Mã ABC</h2>
          <button id="toggle-view-btn" class="toggle-btn" style="position: absolute; right: 20px;">🎵 Xem Sheet Nhạc</button>
        </div>
        
        <div class="panel-content editor-content">
          <!-- Text area for ABC Notation -->
          <div class="abc-input-container" id="abc-view">
            <label for="abc-code">Mã ABC Notation (Gõ đến đâu, nhạc cập nhật đến đó!)</label>
            <textarea id="abc-code" spellcheck="false" placeholder="Gõ abc vào đây..."></textarea>
          </div>

          <!-- Karaoke Mode Container -->
          <div class="karaoke-container" id="karaoke-view" style="display: none;">
            <div class="karaoke-controls">
              <button id="play-btn" class="ctrl-btn play">▶ Phát Nhạc</button>
              <button id="stop-btn" class="ctrl-btn stop" style="display: none;">⏹ Dừng Lại</button>
              
              <div class="tempo-control">
                <label for="tempo-slider">Tốc độ (Tempo): <span id="tempo-value">100</span>%</label>
                <input type="range" id="tempo-slider" min="50" max="200" value="100" />
              </div>
            </div>
            <!-- Second Sheet Music display for Karaoke -->
            <div id="karaoke-paper" class="sheet-music-display karaoke-paper"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- NEW STUDIO TAB (Nghe Nhạc) -->
    <main class="app-container tab-content" id="tab-listen" style="display: none;">
      <!-- Left: Main Studio Area (Canvas & Controls) -->
      <section class="panel left-panel" style="flex: 2;">
        <div class="panel-header">
          <h2>🎧 Canvas Studio Renderer</h2>
        </div>
        <div class="panel-content" style="display: flex; flex-direction: column; gap: 15px;">
          <!-- ABCJS Paper for Studio -->
          <div class="sheet-viewport" style="flex: 1; border: 2px solid #eee; border-radius: 12px; overflow-y: auto; background: #fff; padding: 20px;">
            <div id="studio-abc-paper" class="sheet-music-display"></div>
          </div>
          <!-- Hidden ABCJS Paper for Audio Generation -->
          <div id="hidden-audio-paper" style="position: absolute; visibility: hidden; width: 1000px; z-index: -1;"></div>
          <!-- Controls -->
          <div class="karaoke-controls" style="margin-top: auto;">
             <button class="ctrl-btn play" id="studioPlayBtn" onclick="toggleStudioPlay()">▶ Phát Nhạc</button>
             <button class="ctrl-btn stop" id="studioStopBtn" style="display: none;" onclick="stopStudioPlay()">⏹ Dừng Lại</button>
             <div class="tempo-control">
               <label>Tempo:</label>
               <input type="range" id="studioTempo" min="50" max="200" value="100" />
             </div>
          </div>
        </div>
      </section>

      <!-- Right: Sidebar Settings -->
      <section class="panel right-panel" style="flex: 1;">
        <div class="panel-header" style="background: var(--primary);">
          <h2 style="color: white;">🎛️ Bàn Trộn Full Band</h2>
        </div>
        <div class="panel-content editor-content" style="gap: 20px; display: flex; flex-direction: column;">
           <!-- Mixers -->
           <div style="display:flex; justify-content:space-between; align-items: center;"><label>🥁 Trống:</label><input type="range" id="volDrum" min="0" max="1" step="0.05" value="0.75" oninput="updateVolumes()"></div>
           <div style="display:flex; justify-content:space-between; align-items: center;"><label>🎸 Bass:</label><input type="range" id="volBass" min="0" max="1" step="0.05" value="0.65" oninput="updateVolumes()"></div>
           <div style="display:flex; justify-content:space-between; align-items: center;"><label>🎹 Đệm:</label><input type="range" id="volChord" min="0" max="1" step="0.05" value="0.5" oninput="updateVolumes()"></div>
           <div style="display:flex; justify-content:space-between; align-items: center;"><label>🎤 Melody:</label><input type="range" id="volMelody" min="0" max="1" step="0.05" value="0.85" oninput="updateVolumes()"></div>
           
           <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">

           <!-- Dropdowns -->
           <div style="display:flex; flex-direction: column; gap: 5px;">
               <label>Nhạc Cụ (Áp dụng cho toàn bài):</label>
               <select id="studioInstrument" onchange="renderStudioSheet()" style="padding: 8px; border-radius: 6px; border: 1px solid #ddd;">
                   <option value="0">Acoustic Piano</option>
                   <option value="12">Marimba</option>
                   <option value="73">Flute</option>
                   <option value="81">Synth Lead</option>
               </select>
           </div>
           
           <button class="ctrl-btn play" onclick="exportToJson()" style="margin-top: 15px; width: 100%; font-size: 14px; background: var(--secondary);">⬇️ Xuất JSON cho Full Band Studio</button>
           <!-- Textarea to display exported JSON -->
           <textarea id="jsonExportResult" style="display:none; width: 100%; height: 100px; margin-top: 10px; font-size: 11px; font-family: monospace; border: 1px solid #ddd; border-radius: 4px; padding: 4px;" readonly></textarea>
        </div>
      </section>
    </main>

    <!-- Global functions export for onclick handlers -->
    <script>
       // We will attach global handlers in main.js
    </script>
  <!-- Main Script -->
  <script type="module" src="/main.js"></script>
  </body>
</html>
