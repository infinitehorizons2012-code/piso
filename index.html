<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piso - Viết Nhạc Nhanh</title>
    <!-- Add Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- abcjs CSS -->
    <link rel="stylesheet" href="node_modules/abcjs/abcjs-audio.css">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">🎵</span>
        <h1>Piso Music</h1>
      </div>
      <p class="subtitle">Môi trường soạn thảo ABC Notation chuyên nghiệp!</p>
    </header>

    <main class="app-container">
      <!-- Left side: Image Viewer (Top) + Sheet Music (Bottom) -->
      <section class="panel left-panel">
        <div class="panel-header">
          <h2>👁️ So Sánh Bản Nhạc</h2>
        </div>
        <div class="panel-content" id="comparison-container">
          
          <!-- Image Upload & Viewer -->
          <div id="image-container">
            <div id="upload-prompt" class="upload-prompt">
              <span class="upload-icon">📂</span>
              <p>Kéo thả ảnh hoặc nhấn vào đây để tải ảnh bản nhạc mẫu lên</p>
              <input type="file" id="image-upload" accept="image/*" hidden />
            </div>
            <img id="uploaded-image" style="display: none;" alt="Bản nhạc mẫu" />
          </div>

          <!-- Divider -->
          <div class="divider">Kết Quả (Sheet Music)</div>

          <!-- ABCJS visual rendering -->
          <div id="paper" class="sheet-music-display"></div>

        </div>
      </section>

      <!-- Right side: ABC Editor / Karaoke Mode -->
      <section class="panel right-panel">
        <div class="panel-header" style="background: var(--primary); display: flex; justify-content: space-between; align-items: center;">
          <h2 style="color: white; margin: 0 auto;">✍️ Viết Mã ABC</h2>
          <button id="toggle-view-btn" class="toggle-btn" style="position: absolute; right: 20px;">🎵 Xem Sheet Nhạc</button>
        </div>
        
        <div class="panel-content editor-content">
          <!-- Text area for ABC Notation -->
          <div class="abc-input-container" id="abc-view">
            <label for="abc-code">Mã ABC Notation (Gõ đến đâu, nhạc cập nhật đến đó!)</label>
            <textarea id="abc-code" spellcheck="false" placeholder="Gõ abc vào đây..."></textarea>
          </div>

          <!-- Karaoke Mode Container -->
          <div class="karaoke-container" id="karaoke-view" style="display: none;">
            <div class="karaoke-controls">
              <button id="play-btn" class="ctrl-btn play">▶ Phát Nhạc</button>
              <button id="stop-btn" class="ctrl-btn stop" style="display: none;">⏹ Dừng Lại</button>
              
              <div class="tempo-control">
                <label for="tempo-slider">Tốc độ (Tempo): <span id="tempo-value">100</span>%</label>
                <input type="range" id="tempo-slider" min="50" max="200" value="100" />
              </div>
            </div>
            <!-- Second Sheet Music display for Karaoke -->
            <div id="karaoke-paper" class="sheet-music-display karaoke-paper"></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
